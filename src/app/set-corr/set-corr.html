<div cdkDrag
     cdkDragRootElement="#corr-dlg"
     cdkDragBoundary=".cdk-overlay-container">

    <div class='row-right-stretch dlg-header'>
        <div class="row-left dlg-title" cdkDragHandle>
            {{title()}}
        </div>
        <button type="button" (click)="close()">
            <i class="fa fa-times"></i>
        </button>
    </div>

    <div class="dlg-body">
        <div class="unit-list" role="radiogroup" aria-label="units">
            @for(unit of allUnits(); track unit.units) {
                <label class="unit-item">
                    <input type="radio"
                           [value]="unit.units.toString()"
                           [formField]="corrForm.units">
                    <span>{{ unit.name }}</span>
                </label>
            }
        </div>
    </div>

    <div class='row-right dlg-footer'>
        <button type="button"
                class="saveBtn"
                [disabled]="corrForm().invalid()"
                (click)="save()">
            save
        </button>
    </div>
</div>

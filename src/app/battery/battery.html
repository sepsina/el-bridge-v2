<div class="col-top-strech"
     cdkDrag
     cdkDragRootElement="#battery-dlg"
     cdkDragBoundary=".cdk-overlay-container">

    <div class='row-right-stretch dlg-header'>
        <div class="row-left dlg-title" cdkDragHandle>
            {{title()}}
        </div>
        <button (click)="close()">
            <i class="fa fa-times"></i>
        </button>
    </div>
    <div class="col-top-strech dlg-body">
        @for(row of dataRows(); track row.id){
            <div class = "row-left-stretch data-row-all">
                <label>{{row.label}}</label>
                <div class = "row-left data-row-value" [style.color]="row.color">
                    {{row.value}}
                </div>
            </div>
        }
    </div>

    <div class='row-right dlg-footer'>
    </div>
</div>
